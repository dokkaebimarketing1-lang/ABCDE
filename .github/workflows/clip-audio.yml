name: Clip YouTube audio

on:
  push:
    branches:
      - "claude/add-audio-download-**"
    paths:
      - ".github/workflows/clip-audio.yml"
      - "download_audio.py"
      - "requirements.txt"
  workflow_dispatch:
    inputs:
      url:
        description: "YouTube URL"
        required: true
        default: "https://youtu.be/gSWxf6ar6pM"
      start:
        description: "Start offset in seconds"
        required: false
        default: "0"
      duration:
        description: "Clip length in seconds (empty = full track)"
        required: false
        default: "15"
      format:
        description: "Audio format"
        required: false
        default: "mp3"
      quality:
        description: "Bitrate (kbps)"
        required: false
        default: "192"

permissions:
  contents: write

jobs:
  clip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python deps
        run: |
          set -eux
          pip install --upgrade pip
          pip install -r requirements.txt
          # Bring yt-dlp up to nightly for the latest YouTube extractor
          # fixes; do this AFTER requirements.txt so we keep pytubefix.
          pip install --upgrade --pre "yt-dlp[default]"
          yt-dlp --version
          python -c "import pytubefix; print('pytubefix', pytubefix.__version__)"

      - name: Download / clip audio
        id: download
        env:
          URL: ${{ inputs.url || 'https://youtu.be/gSWxf6ar6pM' }}
          START: ${{ inputs.start || '0' }}
          DURATION: ${{ inputs.duration || '15' }}
          FORMAT: ${{ inputs.format || 'mp3' }}
          QUALITY: ${{ inputs.quality || '192' }}
        continue-on-error: true
        run: |
          set -ux
          mkdir -p clips
          ARGS=("$URL" --output-dir clips --format "$FORMAT" --quality "$QUALITY" --start "$START")
          if [ -n "$DURATION" ]; then
            ARGS+=(--duration "$DURATION")
          fi
          python download_audio.py "${ARGS[@]}" 2>&1 | tee clips/_run.log
          rc=${PIPESTATUS[0]}
          ls -lh clips || true
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          # Always succeed so subsequent steps run; we'll fail explicitly below.
          exit 0

      - name: List clips and fail if no audio produced
        id: check
        run: |
          set -u
          mkdir -p clips
          shopt -s nullglob
          audio=( clips/*.mp3 clips/*.m4a clips/*.wav clips/*.opus clips/*.aac clips/*.flac )
          ls -lh clips || true
          if [ ${#audio[@]} -eq 0 ]; then
            echo "no audio produced" >&2
            echo "produced=false" >> "$GITHUB_OUTPUT"
          else
            echo "produced=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload audio artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audio-clip
          path: clips/*
          if-no-files-found: warn
          retention-days: 7

      - name: Publish clip via gh release
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eux
          ls -lh clips || { echo "no clips dir"; exit 0; }
          tag="clip-${{ github.run_id }}"
          notes="Audio clip from run ${{ github.run_id }} of ${{ github.sha }}"
          gh release create "$tag" --title "Audio clip ${{ github.run_id }}" --notes "$notes" clips/* || true

      - name: Commit clip via Contents API (fallback)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          [ -d clips ] || { echo "no clips dir"; exit 0; }
          for f in clips/*; do
            [ -e "$f" ] || continue
            name=$(basename "$f")
            sanitized=$(echo "$name" | tr ' ' '_' | tr -cd 'A-Za-z0-9._-')
            path="clips/${sanitized}"
            b64=$(base64 -w0 "$f")
            payload=$(jq -n --arg msg "Add audio clip from run ${{ github.run_id }}" \
                            --arg content "$b64" \
                            --arg branch "${GITHUB_REF_NAME}" \
                            '{message:$msg, content:$content, branch:$branch}')
            echo "PUT clips/${sanitized} (${#b64} b64 chars)"
            curl -sSf -X PUT \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/contents/${path}" \
              -d "$payload" \
              -o /tmp/contents-resp.json || {
                echo "Contents API failed:";
                cat /tmp/contents-resp.json || true;
                continue;
              }
            jq '{path: .content.path, sha: .content.sha, size: .content.size, html_url: .content.html_url}' /tmp/contents-resp.json
          done

      - name: Summary
        if: always()
        run: |
          {
            echo "### Audio clip results"
            echo
            if compgen -G "clips/*" > /dev/null; then
              ls -lh clips | sed 's/^/    /'
            else
              echo "_No clips produced._"
            fi
            echo
            echo "Release tag: \`clip-${{ github.run_id }}\`"
            echo "Branch: \`${GITHUB_REF_NAME}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail the run if no audio was produced
        if: always() && steps.check.outputs.produced != 'true'
        run: |
          echo "::error::No audio file produced; see clips/_run.log committed back to the branch."
          exit 1
