name: Clip YouTube audio

on:
  push:
    branches:
      - "claude/add-audio-download-**"
    paths:
      - ".github/workflows/clip-audio.yml"
      - "download_audio.py"
      - "requirements.txt"
  workflow_dispatch:
    inputs:
      url:
        description: "YouTube URL"
        required: true
        default: "https://youtu.be/gSWxf6ar6pM"
      start:
        description: "Start offset in seconds"
        required: false
        default: "0"
      duration:
        description: "Clip length in seconds (empty = full track)"
        required: false
        default: "15"
      format:
        description: "Audio format"
        required: false
        default: "mp3"
      quality:
        description: "Bitrate (kbps)"
        required: false
        default: "192"

permissions:
  contents: write

jobs:
  clip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Download / clip audio
        env:
          URL: ${{ inputs.url || 'https://youtu.be/gSWxf6ar6pM' }}
          START: ${{ inputs.start || '0' }}
          DURATION: ${{ inputs.duration || '15' }}
          FORMAT: ${{ inputs.format || 'mp3' }}
          QUALITY: ${{ inputs.quality || '192' }}
        run: |
          mkdir -p clips
          ARGS=("$URL" --output-dir clips --format "$FORMAT" --quality "$QUALITY" --start "$START")
          if [ -n "$DURATION" ]; then
            ARGS+=(--duration "$DURATION")
          fi
          python download_audio.py "${ARGS[@]}"

      - name: List clips
        run: ls -lh clips

      - name: Upload audio artifact
        uses: actions/upload-artifact@v4
        with:
          name: audio-clip
          path: clips/*
          if-no-files-found: error
          retention-days: 7

      - name: Publish clip as a GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: clip-${{ github.run_id }}
          name: Audio clip ${{ github.run_id }}
          body: |
            Audio clip generated by run ${{ github.run_id }}.
            Source: ${{ inputs.url || 'https://youtu.be/gSWxf6ar6pM' }}
            Start: ${{ inputs.start || '0' }}s, Duration: ${{ inputs.duration || '15' }}s,
            Format: ${{ inputs.format || 'mp3' }} @ ${{ inputs.quality || '192' }} kbps
          files: clips/*
